<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="LogIn.css" />
  </head>

  <body>
    <header class="topbar">
      <a class="back" href="Homepage.html">Home Page</a>
    </header>

    <main class="auth">
      <div class="auth-card">
        <h2>Log In</h2>
        <p class="auth-sub">Kyçu për të vazhduar</p>

        <form action="#" method="post">
          <div class="input-box">
            <img src="user.png" class="icons" alt="Username" />
            <input type="text" placeholder="Username" required />
          </div>

          <div class="input-box">
            <img src="pass.png" class="icons" alt="Password" />
            <input type="password" placeholder="Password" required />
          </div>

          <button type="submit" class="btn-gold">Log In</button>

          <p class="auth-foot">
            Nuk ke llogari?
            <a href="RegisterPage.html">Regjistrohu</a>
          </p>
        </form>
      </div>
    </main>
  </body>
</html>
