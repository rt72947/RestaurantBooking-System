<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="RegisterPage.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="RegisterPage.js"></script>
</head>
<body>
    <div class="register">
        <div class="register_form">
            <h2>Sign Up</h2>
            <form id='form' action="#" method="post">
                <div class="input-box" >
                    <img src="user.png" class="icons" alt="Username">
                    <input id="username" type="text"  placeholder="First Name" >
                    <div class="error"></div>
                </div>
                <div class="input-box">
                    <img src="emaill.png" class="icons" alt="Email">
                    <input id="email" type="text" placeholder="Email" >
                    <div class="error"></div>
                </div>
                <div class="input-box">
                    <img src="pass.png" class="icons" alt="password">
                    <input id="password" type="password" placeholder="Password" >
                    <div class="error"></div>
                </div>
                <div class="input-box">
                    <img src="pass.png" class="icons" alt="password">
                    <input id="confirmPassword" type="password" placeholder="Confirm password" >
                    <div class="error"></div>
                </div>
                <button type="submit" class="button">Sign Up</button>
                <p> Already have an account?  <a href="LogIn.html"> Login </a> </p>
            </form>
        </div>
    </div>
</body>
</html>
